<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#16110d">
<title>Eldoret Grill - Nyama Choma & More | Eldoret CBD</title>
<meta name="description" content="Eldoret Grill, CBD opposite Naivas. Nyama choma, kuku kienyeji, pilau and chips. Order on WhatsApp, delivery in 30 minutes. Open 8am - 10pm.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#16110d;
  --surface:#221a14;
  --line:#3a2c22;
  --text:#f6ede3;
  --muted:#b5a495;
  --ember:#f26b1d;
  --whatsapp:#25d366;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;line-height:1.5}
a{color:inherit}
.wrap{max-width:480px;margin:0 auto;padding:20px 16px 32px}
header{display:flex;flex-direction:column;gap:6px;padding:8px 0 20px}
.badge{display:inline-flex;align-self:flex-start;align-items:center;gap:6px;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ember)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ember);box-shadow:0 0 10px var(--ember)}
h1{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;font-size:44px;line-height:1;margin:0;letter-spacing:-.02em}
.loc{margin:0;color:var(--muted);font-size:15px}
.cta{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--whatsapp);color:#0b2a17;text-decoration:none;font-weight:600;font-size:17px;padding:16px;border-radius:14px;min-height:56px}
.cta:focus-visible,.order:focus-visible{outline:3px solid var(--text);outline-offset:3px}
.cta svg{width:22px;height:22px}
.facts{display:flex;gap:8px;margin:14px 0 0;padding:0;list-style:none}
.facts li{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.facts b{display:block;font-size:15px}
.facts span{font-size:12px;color:var(--muted)}
h2{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:600;font-size:22px;margin:32px 0 14px}
.menu{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:0;padding:0;list-style:none}
.item{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.item img{display:block;width:100%;height:auto;aspect-ratio:1;object-fit:cover}
.body{display:flex;flex-direction:column;gap:4px;flex:1;padding:12px}
.item h3{margin:0;font-size:15px;font-weight:600;line-height:1.25}
.desc{margin:0;font-size:13px;color:var(--muted);flex:1}
.row{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:8px}
.price{font-weight:600;color:var(--ember);font-size:14px;white-space:nowrap}
.order{background:var(--text);color:var(--bg);text-decoration:none;font-size:13px;font-weight:600;padding:8px 12px;border-radius:999px;min-height:36px;display:inline-flex;align-items:center}
footer{margin-top:32px;padding-top:20px;border-top:1px solid var(--line);text-align:center;color:var(--muted);font-size:13px}
footer p{margin:4px 0}
</style>
</head>
<body>
<main class="wrap">
  <header>
    <span class="badge"><span class="dot" aria-hidden="true"></span>Charcoal grill</span>
    <h1>Eldoret Grill</h1>
    <p class="loc">CBD, opposite Naivas &middot; Order on WhatsApp</p>
  </header>

  <a id="main-cta" class="cta" href="#">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.5 14.4c-.3-.1-1.8-.9-2-1-.3-.1-.5-.1-.7.1-.2.3-.8 1-.9 1.2-.2.2-.3.2-.6.1-.3-.1-1.3-.5-2.4-1.5-.9-.8-1.5-1.8-1.7-2.1-.2-.3 0-.5.1-.6l.4-.5c.2-.2.2-.3.3-.5.1-.2 0-.4 0-.5l-.9-2.2c-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.5s1.1 2.9 1.2 3.1c.1.2 2.1 3.2 5.1 4.5.7.3 1.3.5 1.7.6.7.2 1.4.2 1.9.1.6-.1 1.8-.7 2-1.4.2-.7.2-1.3.2-1.4-.1-.2-.3-.3-.6-.4zM12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2c-1.5 0-3-.4-4.3-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2z"/></svg>
    Order on WhatsApp
  </a>

  <ul class="facts">
    <li><b>30 min</b><span>Delivery</span></li>
    <li><b>8am&ndash;10pm</b><span>Daily</span></li>
    <li><b>Eldoret</b><span>Town</span></li>
  </ul>

  <h2>Menu</h2>
  <ul id="menu" class="menu"></ul>

  <footer>
    <p>Delivery 30 mins &middot; Eldoret Town &middot; Open 8am&ndash;10pm</p>
    <p>Eldoret Grill, CBD opposite Naivas</p>
  </footer>
</main>

<script>
// Replace with the restaurant's WhatsApp number (country code, no + or spaces), e.g. 254712345678
const WHATSAPP_NUMBER = "2547XXXXXXXX";

const MENU = [
  { name: "Nyama Choma", price: 600, image: "images/nyama-choma.png", desc: "Mbuzi, kachumbari + ugali" },
  { name: "Chips Kavu + Soda", price: 250, image: "images/chips-soda.png", desc: "Fresh chips + soda" },
  { name: "Kuku Kienyeji Full", price: 1500, image: "images/kuku-kienyeji.png", desc: "Full chicken + ugali" },
  { name: "Pilau Kuku", price: 450, image: "images/pilau-kuku.png", desc: "Swahili pilau + kuku" }
];

const waLink = (text) => `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(text)}`;
const formatPrice = (n) => `KES ${n.toLocaleString("en-KE")}`;

document.getElementById("main-cta").href = waLink("Hi Eldoret Grill, I want to order");

document.getElementById("menu").innerHTML = MENU.map((item) => `
  <li class="item">
    <img src="${item.image}" alt="${item.name}: ${item.desc}" width="512" height="512" loading="lazy">
    <div class="body">
      <h3>${item.name}</h3>
      <p class="desc">${item.desc}</p>
      <div class="row">
        <span class="price">${formatPrice(item.price)}</span>
        <a class="order" href="${waLink(`Hi Eldoret Grill, I want ${item.name} - ${formatPrice(item.price)}`)}" aria-label="Order ${item.name} on WhatsApp">Order</a>
      </div>
    </div>
  </li>`).join("");
</script>
</body>
</html>
